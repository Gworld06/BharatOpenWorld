
name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"

          java -version
          keytool -help >/dev/null 2>&1 || true
          sdkmanager --version

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true

      - name: Verify Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          godot --version

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Configure Android signing
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          test -x "$JAVA_HOME/bin/java"
          test -d "$ANDROID_HOME/platform-tools"
          test -f "$HOME/.android/debug.keystore"

      - name: Enable Android texture import support
        shell: bash
        run: |
          set -euo pipefail

          test -f project.godot

          python3 - <<'PY'
          from pathlib import Path

          path = Path("project.godot")
          content = path.read_text()

          setting = "textures/vram_compression/import_etc2_astc=true"

          if setting not in content:
              marker = "[rendering]"
              if marker not in content:
                  raise SystemExit("Missing [rendering] section in project.godot")

              content = content.replace(
                  marker,
                  marker + "\n" + setting,
                  1
              )

          path.write_text(content)
          print("Android ETC2/ASTC texture import enabled.")
          PY

          grep -n "import_etc2_astc" project.godot

      - name: Prepare Android export preset
        shell: bash
        run: |
          set -euo pipefail

          test -f export_presets.cfg

          grep -q 'name="Android"' export_presets.cfg

          # Remove SDK overrides that conflict with non-Gradle export.
          sed -i \
            '/^gradle_build\/min_sdk=/d; /^gradle_build\/target_sdk=/d' \
            export_presets.cfg

          # Use the generated debug signing key explicitly.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("export_presets.cfg")
          content = path.read_text()

          for key in (
              "keystore/debug=",
              "keystore/debug_user=",
              "keystore/debug_password="
          ):
              content = "\n".join(
                  line for line in content.split("\n")
                  if not line.startswith(key)
              )

          marker = "[preset.0.options]"
          if marker not in content:
              raise SystemExit("Missing Android preset options section")

          settings = (
              'keystore/debug="/home/runner/.android/debug.keystore"\n'
              'keystore/debug_user="androiddebugkey"\n'
              'keystore/debug_password="android"\n'
          )

          content = content.replace(
              marker,
              marker + "\n" + settings.rstrip(),
              1
          )

          path.write_text(content)
          PY

          cat export_presets.cfg

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --path . --editor --import \
            2>&1 | tee /tmp/godot-import.log

      - name: Verify project scripts
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --path . --editor --quit \
            2>&1 | tee /tmp/godot-verify.log

          if grep -E \
            "SCRIPT ERROR:|Parse Error:|Failed to load script" \
            /tmp/godot-verify.log; then
            echo "Project script verification failed."
            exit 1
          fi

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          godot --headless --verbose --path . \
            --export-debug "Android" \
            build/BharatOpenWorld-debug.apk \
            2>&1 | tee /tmp/godot-export.log

          test -s build/BharatOpenWorld-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/BharatOpenWorld-debug.apk"

          test -s "$APK"
          file "$APK"
          unzip -t "$APK"

          echo "APK archive verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BharatOpenWorld-debug-apk
          path: build/BharatOpenWorld-debug.apk
          if-no-files-found: error
          retention-days: 14
