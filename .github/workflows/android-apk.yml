
name: Build Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Verify Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          java -version
          sdkmanager --version

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true

      - name: Verify Godot installation
        shell: bash
        run: |
          godot --version
          test -d "$HOME/.local/share/godot/export_templates/4.3.stable"

      - name: Verify project
        shell: bash
        run: |
          godot --headless --path . --editor --quit

      - name: Export Android debug APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/BharatOpenWorld-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          test -s build/BharatOpenWorld-debug.apk
          file build/BharatOpenWorld-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BharatOpenWorld-debug-apk
          path: build/BharatOpenWorld-debug.apk
          if-no-files-found: error
          retention-days: 14
